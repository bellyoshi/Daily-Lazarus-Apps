<svg version="1.1" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean -->
  <rect width="100%" height="100%" fill="#ADD8E6" />
  
  <!-- Continents (Simplified Representation) -->
  <!-- North America -->
  <path d="M 50 50 L 250 50 L 200 150 L 100 180 Z" fill="#90EE90" stroke="#006400" stroke-width="2" />
  <!-- South America -->
  <path d="M 180 180 L 280 180 L 250 350 L 180 300 Z" fill="#90EE90" stroke="#006400" stroke-width="2" />
  
  <!-- Europe/Asia -->
  <path d="M 300 50 L 750 50 L 700 200 L 400 200 L 350 150 Z" fill="#90EE90" stroke="#006400" stroke-width="2" />
  
  <!-- Africa -->
  <path d="M 350 150 L 500 150 L 450 300 L 350 250 Z" fill="#90EE90" stroke="#006400" stroke-width="2" />
  
  <!-- Australia -->
  <path d="M 600 250 L 750 250 L 720 350 L 580 320 Z" fill="#90EE90" stroke="#006400" stroke-width="2" />

  <!-- City Markets (Red Dots) -->
  <!-- Tokyo -->
  <circle cx="700" cy="120" r="5" fill="red" />
  <!-- London -->
  <circle cx="360" cy="90" r="5" fill="red" />
  <!-- New York -->
  <circle cx="210" cy="110" r="5" fill="red" />
  
</svg>
